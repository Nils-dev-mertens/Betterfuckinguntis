name: Deploy

# Rebuild and redeploy both web deployments on the own server whenever main
# changes:
#  - the download landing page (website/, root Dockerfile) → calendar-site :5200
#  - the web app preview (dist/ + CORS proxy, Dockerfile.web) → calendar-web :5201
# The APK pipelines are separate: update.yml publishes OTA updates,
# release.yml builds APKs.

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Connect runner to Tailscale
      - name: Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          version: latest

      # Deploy to server
      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Deploy
        run: |
          sshpass -p "${{ secrets.SERVER_PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.TS_USER }}@${{ secrets.TS_HOST }} "
          cd /home/${{ secrets.TS_USER }}/Desktop/actually-usable-calendar/
          git checkout main
          git pull
          docker compose down
          docker compose up -d --build
          "
