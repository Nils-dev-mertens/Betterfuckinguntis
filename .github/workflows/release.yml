name: release

# Build a sideloadable APK whenever a version tag is pushed (v1.0.1, ...).
# The build runs on EAS's cloud (reliable, ~15-20 min — no cold Gradle/SDK
# downloads on the runner), the workflow waits for it and attaches the APK to
# a GitHub Release, so the website (or any user) can link to a stable,
# permanent download per version.

# ── Version failsafe ──────────────────────────────────────────────────────
# A tag alone doesn't change the app version — the APK reports whatever is in
# app.json, and Android needs a strictly increasing versionCode to allow
# installing over an old build. To never ship a release that looks/behave like
# the previous one, the workflow syncs app.json, package.json and
# android.versionCode to the pushed tag and commits that back to main before
# building. The EAS build then always produces, e.g., version 1.0.2
# (versionCode 3) for tag v1.0.2 — regardless of what the repo said.

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    # Fail fast instead of hanging for hours (GitHub's default is 360 min).
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Check for EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "Add the EXPO_TOKEN secret (expo.dev/settings/access-tokens) to this repo."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Needed to push the version-sync commit back to main.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # ── Version sync (the failsafe) ────────────────────────────────────
      # Rewrite the version fields from the pushed tag (vX.Y.Z → X.Y.Z),
      # versionCode = major*10000 + minor*100 + patch (monotonic per
      # semver comparison; v1.0.2 → 10002, v1.1.0 → 10100, v2.0.0 → 20000),
      # and commit+push back to main so the released state is in the repo.
      - name: Sync version to tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if ! [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag '${GITHUB_REF_NAME}' is not vX.Y.Z — cannot derive a version."
            exit 1
          fi
          MAJOR=$(echo "$TAG" | cut -d. -f1)
          MINOR=$(echo "$TAG" | cut -d. -f2)
          PATCH=$(echo "$TAG" | cut -d. -f3)
          VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))

          node -e "
            const fs = require('fs');
            const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            app.expo.version = '$TAG';
            app.expo.android = { ...(app.expo.android ?? {}), versionCode: $VERSION_CODE };
            fs.writeFileSync('app.json', JSON.stringify(app, null, 2) + '\n');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '$TAG';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

          echo "Tag v$TAG → version $TAG, versionCode $VERSION_CODE"
          git diff --stat

      - name: Commit synced version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "app.json/package.json already match the tag — nothing to commit."
          else
            git add app.json package.json
            git commit -m "chore: sync version to ${GITHUB_REF_NAME} [skip ci]"
            # Retry loop: rebase in case a push to main raced with us.
            for i in 1 2 3; do
              if git push origin HEAD:main; then
                echo "Pushed version-sync commit to main."
                exit 0
              fi
              echo "Push failed (attempt $i) — rebasing onto origin/main and retrying…"
              git fetch origin main
              git rebase origin/main
            done
            echo "Could not push the version-sync commit after 3 attempts."
            exit 1
          fi

      - name: Typecheck
        run: bun run typecheck

      # Queue the build on EAS and grab its id (--no-wait returns immediately;
      # the next step polls). Your first cloud build already created the EAS
      # project + keystore, so this is fully non-interactive.
      - name: Trigger EAS build
        id: trigger
        run: |
          eas build --platform android --profile apk --non-interactive --no-wait --json > build.json
          BUILD_ID=$(jq -r '.[0].id // .id' build.json)
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"
          echo "EAS build queued: https://expo.dev/accounts/$(jq -r '.[0].project.name // empty' build.json 2>/dev/null || true) (id: $BUILD_ID)"

      # Wait for FINISHED (status: NEW → IN_QUEUE → IN_PROGRESS → FINISHED),
      # then download the APK artifact and hand it to the release step.
      # The status call itself is retried: a transient eas CLI/API hiccup
      # must not fail a release that's otherwise 20 minutes in.
      - name: Wait for build to finish
        run: |
          BUILD_ID="${{ steps.trigger.outputs.build_id }}"
          for i in $(seq 1 50); do
            STATUS=""
            for attempt in 1 2 3 4 5; do
              if JSON=$(eas build:view "$BUILD_ID" --json 2>/dev/null); then
                STATUS=$(echo "$JSON" | jq -r '.status // empty')
                [ -n "$STATUS" ] && break
              fi
              echo "[poll $i.$attempt] status call failed — retrying in 15s"
              sleep 15
            done
            if [ -z "$STATUS" ]; then
              echo "Could not read the build status after 5 attempts."
              echo "Check the build manually on https://expo.dev/accounts/ (build id: $BUILD_ID)."
              exit 1
            fi
            echo "[$i] status: $STATUS"
            case "$STATUS" in
              FINISHED)
                URL=$(eas build:view "$BUILD_ID" --json | jq -r '.artifacts.buildUrl')
                echo "Downloading $URL"
                curl -fL --retry 5 "$URL" -o app-release.apk
                exit 0
                ;;
              ERRORED|CANCELED)
                echo "EAS build $STATUS — open the build on https://expo.dev/accounts/ (id: $BUILD_ID) for logs."
                eas build:view "$BUILD_ID" --json | jq '{id, status, error, errorCode, message}' || true
                exit 1
                ;;
            esac
            sleep 60
          done
          echo "Timed out waiting for the EAS build after 50 minutes."
          exit 1

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: app-release.apk
          generate_release_notes: true
