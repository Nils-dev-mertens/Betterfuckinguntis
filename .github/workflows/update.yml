name: update

# Publish an EAS Update whenever JS changes land on main. Devices pick it up
# on next launch — no reinstall needed. Native changes are ignored here (the
# fingerprint runtime version makes them a no-op until a new APK ships).

on:
  push:
    branches: [main]

jobs:
  update:
    name: EAS Update
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check for EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "Add the EXPO_TOKEN secret (expo.dev/settings/access-tokens) to this repo."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Publish update
        run: eas update --auto --branch production
